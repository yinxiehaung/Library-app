events {
    # 允許的最大連線數
    worker_connections 1024;
}

http {
    # 載入標準 MIME 類型設定 (確保 CSS/JS 檔案類型正確)
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    
    limit_req_zone $binary_remote_addr zone=apilimit:10m rate=2r/s;
    
    # 定義內部 Flask 後端伺服器群組 (5000 port)
    upstream backend_servers {
        server api-1:5000;
        server api-2:5000;
        ip_hash;
    }

    # HTTP 轉 HTTPS
    server {    
        listen 80;
        return 301 https://$host$request_uri;
    }

    # HTTPS 主要設定
    server {
        listen 443 ssl;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;

        limit_req zone=apilimit burst=10 nodelay;
        limit_req_status 429;

        # 1. 前端頁面：轉發給 frontend 容器 (因為 Vite 產物已放進 Nginx 的 80 port)
        location / {
            proxy_pass http://frontend:80;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 2. 內部 Flask API：轉發給 "backend_servers" 群組
        location /api {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 3. 🌟 新增的秘密通道：安全轉發給外部的 Python FastAPI 大腦
        # 注意後面的斜線很重要！
        location /ai-api/ {
            proxy_pass http://192.168.222.147:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # 4. Swagger 文件相關
        location /doc {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /swaggerui {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
        location /swagger.json {
            proxy_pass http://backend_servers;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}
